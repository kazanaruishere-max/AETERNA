# Dependabot Configuration — AETERNA Quant Project
# Mandate: Security Patch Flow & Minimal Disruption
# - Major/minor version bumps are ignored to preserve numerical determinism.
# - Patch security updates are allowed via Dependabot PRs.
# - Zero Auto-Merge: All PRs require branch protection and Human Operator review.

version: 2
updates:
  # ----------------------------------------------------------------------------
  # Python Toolchain (Root uv / pyproject.toml / uv.lock)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"

  # ----------------------------------------------------------------------------
  # Rust Engine (engine/analysis_engine/rust)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/engine/analysis_engine/rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "security"
      - "rust"
    commit-message:
      prefix: "chore(deps-rust)"
      include: "scope"

  # ----------------------------------------------------------------------------
  # Go Watchdog Daemon (engine/watchdog)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "gomod"
    directory: "/engine/watchdog"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "security"
      - "go"
    commit-message:
      prefix: "chore(deps-go)"
      include: "scope"
