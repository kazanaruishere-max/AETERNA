name: "CodeQL SAST Analysis"

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 1 * *" # Monthly, first day of month 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE"...HEAD > changed.txt

          if grep -Eq '^(engine/|instruments/|scripts/|db/|tests/|ea/|pyproject\.toml|uv\.lock|go\.mod|aeterna\.ps1|\.github/workflows/)' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["go", "python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

      - name: Build Go watchdog
        if: matrix.language == 'go'
        working-directory: engine/watchdog
        run: go build -a ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: "never"
          output: sarif-results

      - name: Upload SARIF report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results
          retention-days: 7
