name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # --------------------------------------------------------------------------
  # Job 0: Cheap path classification. Workflow-level path filters are avoided
  # because they leave required checks pending. Skipped jobs report Success.
  # --------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      mt5: ${{ steps.detect.outputs.mt5 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "mt5=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE"...HEAD > changed.txt

          if grep -Eq '^(engine/|instruments/|scripts/|db/|tests/|ea/|pyproject\.toml|uv\.lock|go\.mod|aeterna\.ps1|\.github/workflows/)' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(engine/execution/|engine/ingestion/python/exness_client\.py|engine/telegram_bot/|tests/e2e/|ea/|tests/test_emergency_handler\.py)' changed.txt; then
            echo "mt5=true" >> "$GITHUB_OUTPUT"
          else
            echo "mt5=false" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # Job 1: Secrets & Security Scan — always runs on every PR.
  # --------------------------------------------------------------------------
  security-secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Job 2: Code Quality & Linting
  # --------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust Toolchain
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python Dependencies (Locked)
        run: uv sync --frozen --all-groups

      - name: Build Rust PyO3 Extension (Locked)
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        run: uv run maturin develop --locked --manifest-path engine/analysis_engine/rust/Cargo.toml

      - name: Run Pyright (Strict Mode)
        run: uv run pyright

      - name: Run 5-Pillar Ecosystem Safety & Invariant Audit
        if: hashFiles('scripts/verify_ecosystem.py') != ''
        run: uv run python scripts/verify_ecosystem.py --safety

      - name: Run Cargo Clippy (Locked)
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        run: cargo clippy --locked --manifest-path engine/analysis_engine/rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Set up Go
        if: hashFiles('engine/watchdog/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: engine/watchdog/go.sum

      - name: Run Go Vet
        if: hashFiles('engine/watchdog/go.mod') != ''
        run: cd engine/watchdog && go vet ./...

  # --------------------------------------------------------------------------
  # Job 3: Financial Golden Tests (Mandatory Blocking Gate)
  # --------------------------------------------------------------------------
  financial-golden-tests:
    name: Financial Golden Tests (Deterministic)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust Toolchain
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python Dependencies (Locked)
        run: uv sync --frozen --all-groups

      - name: Build Rust PyO3 Extension (Locked)
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        run: uv run maturin develop --locked --manifest-path engine/analysis_engine/rust/Cargo.toml

      - name: Execute Deterministic Financial Golden Tests
        run: uv run pytest tests/ -v -m "golden or not integration"

  # --------------------------------------------------------------------------
  # Job 4: Rust & Go Unit Tests
  # --------------------------------------------------------------------------
  core-engines-test:
    name: Rust & Go Core Tests
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Rust
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Test (Locked)
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo test --locked --manifest-path engine/analysis_engine/rust/Cargo.toml --all --verbose

      - name: Set up Go
        if: hashFiles('engine/watchdog/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: engine/watchdog/go.sum

      - name: Run Go Tests
        if: hashFiles('engine/watchdog/go.mod') != ''
        run: cd engine/watchdog && go test -v -race ./...

  # --------------------------------------------------------------------------
  # Job 5: MetaTrader 5 Windows Integration Suite — runs only on MT5-related
  # changes or manual dispatch. Windows minutes are costlier than Linux.
  # --------------------------------------------------------------------------
  mt5-windows-suite:
    name: MT5 Windows Integration Suite
    needs: [changes, lint-and-typecheck, financial-golden-tests]
    if: needs.changes.outputs.mt5 == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12 (Win32 Native)
        run: uv python install 3.12

      - name: Set up Rust Toolchain
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Locked)
        run: uv sync --frozen --all-groups

      - name: Build Rust PyO3 Extension (Locked)
        if: hashFiles('engine/analysis_engine/rust/Cargo.toml') != ''
        run: uv run maturin develop --locked --manifest-path engine/analysis_engine/rust/Cargo.toml

      - name: Run MT5 Execution Tests (Mock / Offline Terminal Tests)
        run: |
          uv run pytest tests/ -v -k "mt5 or execution or telegram"
